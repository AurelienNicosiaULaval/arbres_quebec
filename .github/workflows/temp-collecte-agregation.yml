name: Collecte temporaire agrégation externe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        lot: [officiel, universites, minerve, agreg_maths]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install --upgrade requests beautifulsoup4 lxml pypdf
      - name: Aspirer les ressources publiques
        run: python temp_run_agregation.py --lot '${{ matrix.lot }}'
      - name: Publier le lot
        uses: actions/upload-artifact@v4
        with:
          name: agregation-externe-${{ matrix.lot }}
          path: |
            agregation_externe_${{ matrix.lot }}.zip
            agregation_externe_${{ matrix.lot }}/SUMMARY.json
            agregation_externe_${{ matrix.lot }}/MANIFEST.csv
            agregation_externe_${{ matrix.lot }}/README.md
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
